site_name: Cue
site_description: Documentation for Cue - Distributed in-memory job queue with Raft
site_url: https://m-javani.github.io/cue-docs/
repo_url: https://github.com/m-javani/cue
repo_name: m-javani/cue
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logos/logo-white.png
  favicon: favicon.png
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: lime
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  
  features:
    # Navigation enhancements
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.instant        # Faster page loads
    - navigation.instant.progress  # Loading progress bar
    
    # Content enhancements
    - content.code.copy
    - content.tabs.link
    
    # Search enhancements
    - search.suggest
    - search.highlight
    
    # Visual enhancements
    - header.autohide           # Cleaner look when scrolling
    - toc.integrate             # Integrate table of contents with navigation (optional)

nav:
  - Home: index.md
  - Cue:
    - Overview: cue/overview.md
    - Configuration: cue/configuration.md
    - Cluster Management: cue/cluster-management.md
    - Monitoring: cue/monitoring.md
    - Deployment: cue/deployment.md
    - Limitations: cue/limitations.md
  - CueProxy:
    - Overview: cueproxy/overview.md
    - API Reference: cueproxy/api.md
    - Configuration: cueproxy/configuration.md
    - Authentication: cueproxy/authentication.md
    - Deployment: cueproxy/deployment.md
    - Monitoring: cueproxy/monitoring.md
  - Quick-Start: quickstart.md
  - Contributing: contributing.md
  
# Add these new sections for better visual design
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/m-javani/cue
      name: Cue (Core)
    - icon: fontawesome/brands/github
      link: https://github.com/m-javani/cue-proxy
      name: CueProxy (Gateway)

extra_css:
  - https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap
  - stylesheets/extra.css
markdown_extensions:
  - attr_list 