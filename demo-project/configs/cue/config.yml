cluster:
  listen_addr: "0.0.0.0"
  snapshot_interval_sec: 60
  snapshot_trigger_count: 10000
  wal_flush_threshold: 1000
  dlq_max_size_bytes: 10485760  # 10MB
  raft_tick_ms: 100 # 100ms
  raft_heartbeat_tick: 5 # with 100ms tick = 500ms
  raft_election_tick: 50 # with 100ms tick = 5 seconds

proxy:
  addr: "0.0.0.0"

wal:
  compact_after_bytes: 104857600  # 100MB
  sync_interval: "1s"

logging:
  level: "debug"      # debug, info, warn, error
  format: "json"     # json or text
  output_path: "stdout"  # stdout, stderr, or file path

partition:
  active_queue_capacity: 10000
  retry_base_delay_ms: 1000
  max_retries: 3
  max_backoff_ms: 2000
  dispatch_batch_size: 128
  dlq_max_bytes: 10485760
  dlq_max_age_ms: 86400000

api:
  listen_addr: "0.0.0.0"
  api_port: 8321

address_resolver:
  type: service # dns, static
  # config:
    # domain: ""
    # port: 8323

tls_verifier:
  type: cn # cn, dns, spiffe
  # config:
  #   domain: "localhost"

    